[package]
name = "nostrd"
version = "1.0.0"
edition = "2021"
description = "A high-performance Nostr relay server implementing NIPs 1, 9, 11, 12, 18, 19, 23, 25, 28, 40, 42, 45, 77"
repository = "https://github.com/nostrd/nostrd"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
heed = "0.20"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
libc = "0.2"
serde_path_to_error = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
tempfile = "3"
tungstenite = "0.24"
ureq = { version = "2", features = ["json"] }
